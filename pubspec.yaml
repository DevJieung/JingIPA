name: meokkiri
description: 눈치 없이 고르고, 취향이 맞는 동료끼리 먹는 밥.
publish_to: none
version: 0.20.3+40
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  app_links: ^7.2.2
  cupertino_icons: ^2.0.0
  http: ^1.6.0
  geolocator: ^14.1.2
  firebase_messaging: ^17.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/demo_restaurants.json
    - assets/brand/waiting-garden-v1.webp
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf
    - family: NotoEmoji
      fonts:
        - asset: assets/fonts/NotoEmoji.ttf
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmojiProfile.ttf
