; 공룡을 찾아라! — 익스포트 프리셋 (Godot 4.7.1)
;
; 이 머신(aarch64)에서는 use_gradle_build=false 로만 APK 가 나온다.
; 미리 구운 템플릿에 프로젝트만 밀어 넣고 zipalign/apksigner 만 쓰므로
; x86_64 전용인 aapt2 를 타지 않는다. 스토어용 AAB 는 Mac 이 필요하다.
;
; ★ 패키지/번들 ID 는 com.devjieung.dinoisland 로 확정했다.
;   com.example.* 는 Google Play 가 거부하고, 다게임 앱이 영구히 한 게임 이름으로
;   식별되는 것은 되돌릴 수 없는 흉터라 지금 정했다. 밑줄은 iOS 익스포트를 멈춘다.
;   ⚠ 기존 두 앱(com.example.dinofind / com.example.frogwarrior)과 패키지가 다르므로
;     세 앱이 폰에 나란히 깔린다. 충돌하지 않는다 — 기존 앱을 지우지 말 것.
;
; iOS 프리셋은 export_project_only=true 라서 어디서 돌리든 Xcode 프로젝트까지만 나온다.
; IPA 로 굽는 건 GitHub Actions 의 맥 러너가 한다(.github/workflows/ios.yml).
; app_store_team_id / bundle_identifier 는 CI 가 Secrets·Variables 값으로 덮어쓴다.
; 여기 적힌 "0000000000" 과 "com.example.dinofind" 는 자리표시자다 — 비워 두면
; Godot 이 "App Store Team ID not specified" 로 익스포트를 거부한다.
; 사람이 할 일(서명 재료·Secrets)은 docs/ios-signing.md.

