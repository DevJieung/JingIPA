; 올인 디펜스 — 익스포트 프리셋 (Godot 4.7.1)
;
; AdMob 네이티브 플러그인을 포함하도록 Gradle로 빌드한다.
; tools/build_apk.sh가 .env 광고 ID, JDK 17, ARM용 aapt2 설정을 적용한다.
;
; ★ 패키지 ID 는 com.devjieung.pokerdefense 다. com.example.* 는 Google Play 가 거부하고,
;   밑줄은 iOS 익스포트를 멈춘다. 한 번 정하면 바꾸지 마라 — 바꾸는 순간 안드로이드가
;   다른 앱으로 보고 기존 기록이 통째로 남남이 된다.
;
; ⚠ include_filter 에 art/anim/*/anim.json 이 들어 있다. 애니메이션 칸 표는 **임포트되는
;   리소스가 아니라 날 파일**이라, 안 적으면 APK 안에서 클립이 통째로 안 뜬다
;   (게임은 안 죽는다 — 정지 그림으로 돈다. 그래서 더 못 알아챈다).
; ⚠ exclude_filter 에 build/* 가 들어 있다. 여기에는 촬영본과 로그가 쌓이므로
;   빼지 않으면 APK 가 수십 MB 불어난다.
;   ★ art/sprite/* 도 뺀다. 스프라이트 시트 백 장의 **원본**이 거기 있는데, 게임이 읽는
;     것은 to_game.py 가 옮겨 놓은 art/anim/<id>/ 쪽이다 — art/sprite/ 를 참조하는 코드는
;     tests/sprite_shot.gd(촬영 도구) 하나뿐이라 폰에서는 한 번도 안 열린다.
;     빼면 APK 가 0.8MB 준다. 값이 작아 보여도 **뜻이 중요하다**: 저것이 실려 있으면
;     「어느 쪽이 게임이 쓰는 시트인가」가 APK 안에서 두 벌이 되어, 다음에 시트를 다시
;     구울 때 엉뚱한 쪽을 고치고 있는지를 알 길이 없다.

