# 공룡섬 — 아이폰/아이패드용 IPA 만들기
#
# ★ APP 값은 project.godot 의 config/name.ios 와 **대소문자까지 완전히 같아야 한다.**
#   이 값이 그대로 PRODUCT_NAME 이자 xcodebuild -scheme 인자가 되기 때문에
#   공백도 한글도 못 쓴다.
#
# 맥이 없어도 됩니다. 두 단계로 나눠서 만듭니다.
#
#   1) project (리눅스) : Godot 로 Xcode 프로젝트를 만든다  ← 검증된 경로, 싸고 빠름
#   2) ipa     (맥)     : xcodebuild 로 그 프로젝트를 구워 IPA 로 만든다
#
# Godot 을 맥에서 직접 돌리지 않는 이유:
#   Godot 4.7 의 iOS 익스포터는 macOS 에서만 도는 "Code-signing dylibs" 블록이
#   application/export_project_only 검사보다 앞에 있어서, 인증서 없는 CI 에서 실패합니다.
#   리눅스에서 나온 Xcode 프로젝트는 맥에서 나오는 것과 같으므로 이렇게 나누면 안전합니다.
#
#   서명 Secrets 가 없으면 -> 서명 없는 IPA (Sideloadly/AltStore 로 직접 서명해서 설치)
#   서명 Secrets 가 있으면 -> 서명된 IPA   (받아서 바로 설치)
#
# 무엇을 넣어야 하는지는 docs/ios-signing.md 에 순서대로 적어 뒀습니다.

name: iOS IPA 만들기

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "release = 아이한테 줄 것 / debug = 문제 찾을 때"
        type: choice
        default: release
        options: [release, debug]
  push:
    tags: ["v*"]          # v1.0.0 처럼 태그를 붙여 올리면 릴리스에 IPA 가 올라간다

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.1"
  GODOT_STATUS: "stable"
  PRESET: "iOS"
  APP: "DinoIsland"

jobs:
  # ── 1단계: 리눅스에서 Xcode 프로젝트 만들기 ──────────────────────
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      config: ${{ steps.export.outputs.config }}
    steps:
      - uses: actions/checkout@v4

      - name: Godot 캐시
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-linux-ios-v1

      - name: Godot 과 iOS 템플릿 내려받기
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          NAME="Godot_v${GODOT_VERSION}-${GODOT_STATUS}"
          mkdir -p "$HOME/godot"
          curl -fsSL --retry 3 -o /tmp/godot.zip "$BASE/${NAME}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          curl -fsSL --retry 3 -o /tmp/templates.tpz "$BASE/${NAME}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$DEST"
          # 전부 두면 2GB, iOS 것만 두면 200MB 라 캐시가 훨씬 빠르다
          mv /tmp/tpl/templates/ios.zip "$DEST/"
          mv /tmp/tpl/templates/version.txt "$DEST/"
          rm -rf /tmp/tpl /tmp/templates.tpz /tmp/godot.zip

      - name: Godot 경로 잡기
        run: |
          set -euo pipefail
          BIN="$(find "$HOME/godot" -maxdepth 2 -type f -name 'Godot*' | head -1)"
          [ -n "$BIN" ] || { echo "Godot 실행 파일을 못 찾았습니다"; ls -R "$HOME/godot"; exit 1; }
          chmod +x "$BIN"
          echo "GODOT=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version

      # 둘 다 없어도 빌드는 된다(서명 없는 IPA). 있으면 그 값으로 덮어쓴다.
      - name: 번들 ID / 팀 ID 채우기
        env:
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${BUNDLE_ID:-}" ]; then
            perl -pi -e "s|^application/bundle_identifier=.*|application/bundle_identifier=\"$BUNDLE_ID\"|" export_presets.cfg
          fi
          if [ -n "${TEAM_ID:-}" ]; then
            perl -pi -e "s|^application/app_store_team_id=.*|application/app_store_team_id=\"$TEAM_ID\"|" export_presets.cfg
          fi
          grep -E '^application/(bundle_identifier|app_store_team_id)=' export_presets.cfg

      - name: 애셋 임포트
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --import || "$GODOT" --headless --path . --import

      - name: Xcode 프로젝트 만들기
        id: export
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
        run: |
          set -euo pipefail
          mkdir -p build/ios
          if [ "$BUILD_TYPE" = "debug" ]; then
            MODE="--export-debug"; CONFIG="Debug"
          else
            MODE="--export-release"; CONFIG="Release"
          fi
          echo "config=$CONFIG" >> "$GITHUB_OUTPUT"
          set +e
          "$GODOT" --headless --path . "$MODE" "$PRESET" "$PWD/build/ios/${APP}.ipa" 2>&1 | tee "$RUNNER_TEMP/godot.log"
          set -e
          # ".ipa 는 macOS 에서만" 경고는 export_project_only=true 라 정상이다.
          if [ ! -d "build/ios/${APP}.xcodeproj" ]; then
            {
              echo "### Godot 익스포트 실패"
              echo '```'
              grep -E 'ERROR|WARNING|error' "$RUNNER_TEMP/godot.log" | tail -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ls -la build/ios

      - name: 꾸러미로 묶기
        run: tar -czf "$RUNNER_TEMP/ios-project.tar.gz" -C build ios

      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project
          path: ${{ runner.temp }}/ios-project.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # ── 2단계: 맥에서 IPA 굽기 ──────────────────────────────────────
  ipa:
    needs: project
    # GitHub 이 맥 이미지를 갈아치우면 저장소 Variables 에 MACOS_RUNNER 를 넣어 바꾼다.
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 60
    env:
      CONFIG: ${{ needs.project.outputs.config }}
    steps:
      - name: 맥/Xcode 버전 적어두기
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/download-artifact@v4
        with:
          name: ios-xcode-project
          path: ${{ runner.temp }}/dl

      - name: 꾸러미 풀기
        run: |
          set -euo pipefail
          mkdir -p build
          tar -xzf "$RUNNER_TEMP/dl/ios-project.tar.gz" -C build
          ls -la "build/ios"
          xcodebuild -list -project "build/ios/${APP}.xcodeproj"

      - name: 서명 재료가 있는지 보기
        id: sign
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "${P12:-}" ] && [ -n "${PROFILE:-}" ] && [ -n "${TEAM_ID:-}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::서명된 IPA 를 만듭니다. 받아서 바로 설치할 수 있습니다."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::서명 재료가 없어 서명 없는 IPA 를 만듭니다. Sideloadly/AltStore 로 설치하세요."
          fi

      # ── (A) 서명 없이 빌드 ───────────────────────────────────────
      - name: 서명 없는 IPA 빌드
        if: steps.sign.outputs.signed == 'false'
        run: |
          set -euo pipefail
          xcodebuild \
            -project "build/ios/${APP}.xcodeproj" \
            -scheme "${APP}" \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          # ★ 이름으로 찾지 말고 find 로 훑는다. PRODUCT_NAME 이 조금만 달라도
          #   ls 패턴이 빗나가서 "빌드는 됐는데 .app 이 없다"가 된다.
          APP_DIR="$(find "$RUNNER_TEMP/dd/Build/Products/${CONFIG}-iphoneos" -maxdepth 1 -name '*.app' | head -1)"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload" build/ipa
          cp -R "$APP_DIR" "$RUNNER_TEMP/Payload/"
          ( cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/build/ipa/${APP}-unsigned.ipa" Payload )

      # ── (B) 서명해서 빌드 ────────────────────────────────────────
      - name: 인증서와 프로파일 설치
        if: steps.sign.outputs.signed == 'true'
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KPW="$(uuidgen)"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${P12_PASSWORD:-}" \
            -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" > /dev/null

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | head -1 | sed -E 's/.*"(.*)"/\1/')"
          [ -n "$IDENTITY" ] || { echo "인증서(.p12)에서 서명 신원을 못 찾았습니다"; exit 1; }

          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/pp.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/pp.mobileprovision" > "$RUNNER_TEMP/pp.plist"
          UUID="$(plutil -extract UUID raw "$RUNNER_TEMP/pp.plist")"
          PNAME="$(plutil -extract Name raw "$RUNNER_TEMP/pp.plist")"
          PAPPID="$(plutil -extract Entitlements.application-identifier raw "$RUNNER_TEMP/pp.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/pp.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          {
            echo "SIGN_IDENTITY=$IDENTITY"
            echo "PROFILE_UUID=$UUID"
            echo "PROFILE_NAME=$PNAME"
            echo "KEYCHAIN_PATH=$KEYCHAIN"
          } >> "$GITHUB_ENV"
          echo "프로파일: $PNAME ($UUID) / 앱ID: $PAPPID / 신원: $IDENTITY"

      - name: 서명된 IPA 빌드
        if: steps.sign.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          # development = 내 기기(UDID 등록)용, ad-hoc = 여러 기기 배포용
          EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'development' }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/${APP}.xcarchive"
          xcodebuild \
            -project "build/ios/${APP}.xcodeproj" \
            -scheme "${APP}" \
            -configuration "$CONFIG" \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            archive 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

          BID="${BUNDLE_ID:-$(plutil -extract ApplicationProperties.CFBundleIdentifier raw "$ARCHIVE/Info.plist")}"
          cat > "$RUNNER_TEMP/export_options.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>${SIGN_IDENTITY}</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>provisioningProfiles</key>
            <dict><key>${BID}</key><string>${PROFILE_NAME}</string></dict>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/export_options.plist"

          mkdir -p build/ipa
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/export_options.plist" \
            -exportPath "$PWD/build/ipa" 2>&1 | tee -a "$RUNNER_TEMP/xcodebuild.log"

      # ── 실패하면 왜 실패했는지 요약에 남긴다 (로그를 못 봐도 알 수 있게) ──
      - name: 실패 원인 요약에 남기기
        if: failure()
        run: |
          set +e
          {
            echo "### xcodebuild 실패"
            echo ""
            echo "**error: 줄**"
            echo '```'
            grep -E '^[^ ]*error:|\*\* .* FAILED \*\*' "$RUNNER_TEMP/xcodebuild.log" | tail -30
            echo '```'
            echo "**마지막 60줄**"
            echo '```'
            tail -60 "$RUNNER_TEMP/xcodebuild.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 결과 ─────────────────────────────────────────────────────
      - name: 만들어진 IPA 확인
        run: |
          set -euo pipefail
          ls -lh build/ipa
          test -n "$(ls build/ipa/*.ipa 2>/dev/null)" || { echo "IPA 가 없습니다"; exit 1; }
          echo "### 만들어진 IPA" >> "$GITHUB_STEP_SUMMARY"
          for f in build/ipa/*.ipa; do
            echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "${{ steps.sign.outputs.signed }}" = "false" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "서명이 안 된 IPA 입니다. Sideloadly / AltStore 로 본인 Apple ID 서명 후 설치하세요." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rogame-ipa-${{ github.run_number }}
          path: build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 태그면 릴리스에도 올리기
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # 이 잡은 checkout 을 안 하므로 알려줘야 한다
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" build/ipa/*.ipa \
            --title "공룡섬 $GITHUB_REF_NAME" \
            --notes "아이폰/아이패드용 IPA" \
          || gh release upload "$GITHUB_REF_NAME" build/ipa/*.ipa --clobber
