name: 먹끼리 iOS 기기 서명 IPA

on:
  workflow_dispatch:
  push:
    branches: [meokkiri]
    paths: [ci/device-signing-request.json]

permissions:
  contents: read

concurrency:
  group: meokkiri-ios-signed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-ipa:
    if: github.ref == 'refs/heads/meokkiri'
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 서명 입력 확인
        env:
          MEOKKIRI_IOS_CERTIFICATE_P12_BASE64: ${{ secrets.MEOKKIRI_IOS_CERTIFICATE_P12_BASE64 }}
          MEOKKIRI_IOS_PROFILE_BASE64: ${{ secrets.MEOKKIRI_IOS_PROFILE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os
          required = ['MEOKKIRI_IOS_CERTIFICATE_P12_BASE64', 'MEOKKIRI_IOS_PROFILE_BASE64']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing GitHub Actions secrets: ' + ', '.join(missing))
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: 웹 공통 소스 확인
        run: python3 scripts/verify_ios_ipa.py --check-source
      - name: 의존성 복원
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get --enforce-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
            ios/Pods
          key: meokkiri-pods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'ios/Podfile') }}
      - name: iOS 기기용 release 앱 빌드
        run: flutter build ios --release --no-codesign --no-pub --dart-define-from-file=config/firebase.mkr-web.ios.json
      - name: 원래 앱 ID로 서명 및 Apple 로그인 권한 검증
        env:
          MEOKKIRI_IOS_CERTIFICATE_P12_BASE64: ${{ secrets.MEOKKIRI_IOS_CERTIFICATE_P12_BASE64 }}
          MEOKKIRI_IOS_CERTIFICATE_PASSWORD: ${{ secrets.MEOKKIRI_IOS_CERTIFICATE_PASSWORD }}
          MEOKKIRI_IOS_PROFILE_BASE64: ${{ secrets.MEOKKIRI_IOS_PROFILE_BASE64 }}
        run: python3 scripts/ios_device_signing.py --app build/ios/iphoneos/Runner.app --report build/ipa/signing-validation.json
      - name: 서명 IPA 패키징
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import pathlib,re; print(re.search(r"^version: (.+)$",pathlib.Path("pubspec.yaml").read_text(),re.M)[1].replace("+","-"))')
          signing=$(python3 -c 'import json; print(json.load(open("build/ipa/signing-validation.json"))["signing"])')
          mkdir -p build/ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          destination="$PWD/build/ipa/meokkiri-${version}-ios-${signing}.ipa"
          (cd build/ipa && ditto -c -k --keepParent Payload "$destination")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ipa=$destination" >> "$GITHUB_OUTPUT"
      - name: 패키징 후 서명 및 IPA 내용 재검증
        run: python3 scripts/verify_ios_ipa.py --ipa '${{ steps.package.outputs.ipa }}' --signing device --report build/ipa/validation.json
      - name: 결과 안내
        run: |
          {
            echo '### 먹끼리 기기 서명 IPA ${{ steps.package.outputs.version }}'
            echo '원래 앱 ID com.meokkiri.meokkiri와 Apple 로그인 권한, 프로파일, 인증서, 코드 서명을 검증했습니다.'
            echo '프로파일에 등록된 기기에 AltStore 재서명 없이 설치하는 development/ad hoc IPA입니다.'
            echo '실기기 설치와 Apple 계정 로그인 완료는 별도 확인이 필요합니다. TestFlight 업로드는 하지 않았습니다.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: meokkiri-signed-ipa-${{ steps.package.outputs.version }}-${{ github.run_number }}
          path: |
            build/ipa/*.ipa
            build/ipa/*validation.json
            ci/source-manifest.json
            ios/Podfile.lock
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
